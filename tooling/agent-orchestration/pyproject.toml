[project]
name = "zeitgeist-orchestration"
version = "0.1.0"
description = "Provider-neutral development orchestration substrate for Zeitgeist"
authors = [
    { name = "schluegge", email = "81178632+schluegge@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.3.15",
    "langgraph>=1.2.11",
    "langgraph-cli[inmem]>=0.4.31",
    "langsmith>=0.10.18",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
